# Coobi Logistics - logistics-api test profile.
#
# The suite runs without a server: the shipped `application.yml` is still loaded (the test
# classpath adds this file on top of it), and this profile replaces the PostgreSQL
# connection with an in-memory database in PostgreSQL compatibility mode, so the constraints
# of the schema - the status, type and severity checks, the unique event id - behave the way
# the production database behaves.
#
# The schema of the tests is generated by Hibernate from the entity mappings. The API owns
# no migration, so there is nothing else to apply; SchemaContractTest pins those mappings to
# the migrations the stream processor owns.

spring:
  datasource:
    # A database per context: two cached contexts never share one in-memory instance.
    url: jdbc:h2:mem:logistics-api-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: logistics-api-test
      # The production pool is read-only; the tests create and drop the schema, so the test
      # pool is not.
      read-only: false
  jpa:
    hibernate:
      ddl-auto: create-drop

coobi:
  statistics:
    stream-processor:
      # A closed port: the statistics endpoint is verified while the processor is
      # unreachable, which is the state of a developer machine that runs only the API.
      metrics-url: http://localhost:1/actuator/metrics
      timeout: 1s

logging:
  level:
    com.coobi.logistics.logisticsapi: INFO
