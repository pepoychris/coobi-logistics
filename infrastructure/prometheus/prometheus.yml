# Coobi Logistics - Prometheus scrape configuration (MVP-8.2).
#
# Prometheus reads this file inside its container, so the targets are the addresses of the
# application services *as seen from that container*:
#
#   - the event generator and the stream processor run from the host (Maven or IDE) in this
#     stack, because no service ships a Dockerfile yet, so their published host ports are
#     reached through `host.docker.internal`, which `compose.yml` maps to the host;
#   - `${PROMETHEUS_HOST}` is supplied by the environment of the Prometheus container, and
#     Prometheus expands it while loading this file. Overriding it is the way to scrape the
#     two services from a different address, for example once they run in containers of their
#     own: `PROMETHEUS_HOST=event-generator` reaches a Compose service by name.
#
# The ports below are the documented defaults of the two services (`server.port` 8080 for the
# generator and 8081 for the processor). A service started with a different `SERVER_PORT`
# needs its target changed here as well.

global:
  # Fifteen seconds keeps the local stack cheap to run and still resolves a throughput spike
  # during a benchmark. Rates are queried with a range window, so the interval also sets the
  # resolution of those queries.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    # Distinguishes this stack from any other database the same Prometheus is pointed at.
    stack: coobi-logistics-local

scrape_configs:
  # Prometheus scrapes itself, so the scrape health of this job is visible in its own UI.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: event-generator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["${PROMETHEUS_HOST}:8080"]

  - job_name: stream-processor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["${PROMETHEUS_HOST}:8081"]
