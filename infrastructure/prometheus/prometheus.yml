# Coobi Logistics - Prometheus scrape configuration (MVP-8.2, containerized by MVP-10.2).
#
# Prometheus reads this file inside its container, so the targets are the addresses of the
# application services *as seen from that container*:
#
#   - the two services run as containers of the same stack, so a target is the service name
#     `compose.yml` gives them, which is what makes the scrape survive without a published host
#     port and without the host gateway;
#   - the names are written out here and not interpolated from the environment, because
#     Prometheus expands `${VAR}` references of its configuration in `external_labels` and
#     nowhere else: a variable in a `static_configs.targets` entry is scraped as its own name
#     (MVP-8 shipped one, and it never resolved). To scrape a service somebody started from the
#     host instead of the container, change its target below to `host.docker.internal:<port>`,
#     which `compose.yml` maps on a Linux engine as well.
#
# The ports below are the documented defaults of the two services (`server.port` 8080 for the
# generator and 8081 for the processor, the ports their images expose). A service started with a
# different `SERVER_PORT` needs its target changed here as well.

global:
  # Fifteen seconds keeps the local stack cheap to run and still resolves a throughput spike
  # during a benchmark. Rates are queried with a range window, so the interval also sets the
  # resolution of those queries.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    # Distinguishes this stack from any other database the same Prometheus is pointed at.
    stack: coobi-logistics-local

scrape_configs:
  # Prometheus scrapes itself, so the scrape health of this job is visible in its own UI.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: event-generator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-generator:8080"]

  - job_name: stream-processor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["stream-processor:8081"]
