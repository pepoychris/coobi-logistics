<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }} - {{ site.tagline }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/docs/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/docs/docs.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="topbar">
      <div class="topbar__identity">
        <img class="topbar__mark" src="{{ '/assets/docs/favicon.svg' | relative_url }}" alt="" width="34" height="34">
        <span class="topbar__names">
          <a class="topbar__title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          <span class="topbar__tagline">{{ site.tagline }}</span>
        </span>
      </div>
      <nav class="topbar__nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Overview</a>
        <a href="{{ '/docs/architecture.html' | relative_url }}">Architecture</a>
        <a href="https://github.com/pepoychris/coobi-logistics">Repository</a>
      </nav>
    </header>

    <div class="shell">
      {% include docs-nav.html %}

      <main class="content" id="content">
        {% if page.content contains '```mermaid' %}
          <noscript>
            <p class="diagram-fallback">The diagrams on this page are drawn with JavaScript. Their source stays readable below each placeholder.</p>
          </noscript>
        {% endif %}

        <article class="doc">
          {{ content }}
        </article>

        <footer class="page-footer">
          <p>
            Coobi Logistics runs locally: <code>docker compose up --build</code>.
            Prose and diagrams live in
            <a href="https://github.com/pepoychris/coobi-logistics/blob/develop/docs/architecture.md">docs/architecture.md</a>.
          </p>
        </footer>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" crossorigin="anonymous" defer></script>
    <script src="{{ '/assets/docs/docs.js' | relative_url }}" defer></script>
  </body>
</html>
