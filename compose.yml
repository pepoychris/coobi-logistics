# Coobi Logistics - local development infrastructure (MVP-0.2).
#
# Single-node Apache Kafka broker running in KRaft mode plus PostgreSQL, and the Prometheus
# that scrapes the two stream services of the pipeline.
# Every published port is bound to the loopback interface, so the stack is
# reachable from this machine only (Global Rule 8).
#
# Values come from `.env` or from the shell environment of the calling process,
# and an exported shell variable wins over the value copied into `.env`. Compose
# resolves the interpolation below before it creates any container, so a missing
# or empty value aborts the command instead of starting an incomplete stack
# (Global Rule 11). A literal `$` inside a value is written as `$$`, because
# Compose interpolates `$` in `.env`: `pa$$word` resolves to `pa$word`.
#
# Copy the template once and set a local password:
#
#   Copy-Item .env.example .env    (PowerShell)
#   cp .env.example .env           (POSIX shell)
#
# Start:  docker compose up --build -d   (canonical local startup, Global Rule 18)
# Status: docker compose ps
# Stop:   docker compose down
#
# `--build` is currently a no-op: no service in this stack ships a Dockerfile yet.
# It stays canonical so the same command keeps working once the application
# services arrive. `docker compose up -d`, the MVP-0.2 acceptance criterion, is
# the equivalent command today.

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      # Host listener. Services launched from the host (Maven or IDE) reach the
      # broker through KAFKA_BOOTSTRAP_SERVERS=localhost:9092.
      - "127.0.0.1:9092:9092"
    environment:
      # CLUSTER_ID is intentionally omitted: the official apache/kafka image supplies
      # a default storage cluster id, which is enough for this single local cluster.
      # It is not a secret, and this stack is single-broker by design rather than a
      # multi-broker configuration.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT      in-network traffic between containers, advertised as kafka:29092
      # CONTROLLER     KRaft quorum traffic, internal to the container, never published
      # PLAINTEXT_HOST traffic from the host machine, advertised as localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker: every internal topic has to fit a replication factor of 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Real broker check: the Admin API answers only once the broker is serving.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18.6
    environment:
      # No defaults on purpose: the `:?` form makes Compose fail before it creates any
      # container when a value is absent or empty (Global Rule 11).
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a non-empty value in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # TCP check instead of the local socket, so a broken listener fails the check.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  prometheus:
    # The BusyBox flavor of the image, so the health check below can use its `wget`.
    image: prom/prometheus:v3.14.0-busybox
    environment:
      # The scrape targets of infrastructure/prometheus/prometheus.yml. The application
      # services run from the host in this stack - no service ships a Dockerfile yet - so the
      # default points at the host, and the published ports of the two services are what gets
      # scraped. Override it to scrape the services from another address.
      PROMETHEUS_HOST: ${PROMETHEUS_HOST:-host.docker.internal}
    ports:
      # The Prometheus UI, its API and its own health endpoint, on the loopback interface
      # only like the rest of the stack (Global Rule 8).
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # `host.docker.internal` is provided by Docker Desktop; on a Linux engine this maps it
      # to the host gateway, so the same definition works on both.
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only: the scrape configuration is versioned in this repository, not edited in the
      # container.
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Fifteen days of local samples: enough to compare runs of a benchmark, small enough that
      # the volume stays a development artifact.
      - "--storage.tsdb.retention.time=15d"
    healthcheck:
      # Real readiness check: `/-/healthy` answers only once the server is serving. A scrape
      # configuration that cannot be loaded stops the server from starting at all, so a
      # container that never becomes healthy is the visible signal of a broken file.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
